<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root { --bg:#f4f4f5; --card:#fff; --key:#e4e4e7; --op:#f59e0b; --text:#18181b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090b; --card:#18181b; --key:#27272a; --op:#d97706; --text:#fafafa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; }
  .calc { width:min(320px, 100vw - 32px); background:var(--card); border-radius:20px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.15); }
  .display { font-size:2.5rem; text-align:right; padding:16px 8px; min-height:80px; overflow-wrap:anywhere; }
  .keys { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  button { font:inherit; font-size:1.25rem; padding:18px 0; border:0; border-radius:12px; background:var(--key); color:var(--text); cursor:pointer; }
  button:active { filter:brightness(.9); }
  .op { background:var(--op); color:#fff; }
  .wide { grid-column:span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="display" id="display">0</div>
  <div class="keys">
    <button data-action="clear">C</button>
    <button data-action="sign">±</button>
    <button data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="op" data-op="*">×</button>
    <button>4</button><button>5</button><button>6</button>
    <button class="op" data-op="-">−</button>
    <button>1</button><button>2</button><button>3</button>
    <button class="op" data-op="+">+</button>
    <button class="wide">0</button>
    <button>.</button>
    <button class="op" data-action="equals">=</button>
  </div>
</div>
<script>
  const display = document.getElementById('display');
  let current = '0', stored = null, op = null, fresh = false;

  const show = () => { display.textContent = current; };
  const calc = (a, b, o) => {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
  };
  const format = n => Number.isFinite(n) ? String(parseFloat(n.toPrecision(12))) : 'Error';

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const { action, op: newOp } = b.dataset;

    if (newOp) {
      if (op && !fresh) current = format(calc(parseFloat(stored), parseFloat(current), op));
      stored = current; op = newOp; fresh = true;
    } else if (action === 'equals') {
      if (op) { current = format(calc(parseFloat(stored), parseFloat(current), op)); op = null; stored = null; fresh = true; }
    } else if (action === 'clear') {
      current = '0'; stored = null; op = null; fresh = false;
    } else if (action === 'sign') {
      if (current !== '0' && current !== 'Error') current = current.startsWith('-') ? current.slice(1) : '-' + current;
    } else if (action === 'percent') {
      current = format(parseFloat(current) / 100);
    } else {
      const key = b.textContent;
      if (fresh || current === '0' || current === 'Error') { current = key === '.' ? '0.' : key; fresh = false; }
      else if (key !== '.' || !current.includes('.')) current += key;
    }
    show();
  });
</script>
</body>
</html>
